name: Build

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.metadata.outputs.matrix }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check release notes
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          node --test scripts/*.test.mjs
          node scripts/release-notes.mjs "$RELEASE_VERSION" > /dev/null

      - name: Set up Task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task setup

      - name: Test
        run: task test

      - name: Build frontend
        run: task web:build

      - name: Define build matrix and version
        id: metadata
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          node -e 'const targets = require("./scripts/release-targets.json"); console.log("matrix=" + JSON.stringify({include: targets.map(target => ({target, artifact: target.replaceAll("/", "-")}))}));' >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload frontend
        uses: actions/upload-artifact@v7.0.2
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Download frontend
        uses: actions/download-artifact@v8.0.2
        with:
          name: web-dist
          path: internal/httpapi/static/dist/

      - name: Build release package
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_TARGET: ${{ matrix.target }}
        run: node scripts/build-release.mjs "$BUILD_VERSION" "$BUILD_TARGET"

      - name: Upload release package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sui-copilot-${{ matrix.artifact }}
          path: |
            bin/release/*.tar.gz
            bin/release/*.zip
          if-no-files-found: error
          retention-days: 14
