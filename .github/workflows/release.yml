name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: sui-copilot-*
          path: bin/
          merge-multiple: true

      - name: Verify all downloads are present
        run: |
          node <<'JS'
          const fs = require('node:fs');
          for (const target of require('./scripts/release-targets.json')) {
            const name = 'sui-copilot-' + target.replaceAll('/', '-') + (target.startsWith('windows/') ? '.exe' : '');
            if (!fs.statSync('bin/' + name).size) throw new Error('Empty binary: ' + name);
          }
          JS

      - name: Include sample configuration
        run: cp sui-copilot.toml.sample bin/

      - name: Generate checksums
        working-directory: bin
        run: sha256sum sui-copilot-* sui-copilot.toml.sample > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/sui-copilot-*
            bin/sui-copilot.toml.sample
            bin/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
