name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Download all release packages
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: sui-copilot-*
          path: bin/release/
          merge-multiple: true

      - name: Verify all release packages are present
        run: |
          node <<'JS'
          const fs = require('node:fs');
          for (const target of require('./scripts/release-targets.json')) {
            const archive = 'sui-copilot-' + target.replaceAll('/', '-') + (target.startsWith('windows/') ? '.zip' : '.tar.gz');
            if (!fs.statSync('bin/release/' + archive).size) throw new Error('Empty package: ' + archive);
          }
          JS

      - name: Generate checksums
        working-directory: bin/release
        run: sha256sum sui-copilot-*.tar.gz sui-copilot-*.zip > SHA256SUMS

      - name: Prepare release notes
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if previous_tag=$(git describe --tags --match 'v[0-9]*' --abbrev=0 "${RELEASE_VERSION}^" 2>/dev/null); then
            changes_url="$REPOSITORY_URL/compare/$previous_tag...$RELEASE_VERSION"
          else
            changes_url="$REPOSITORY_URL/commits/$RELEASE_VERSION"
          fi
          node scripts/release-notes.mjs "$RELEASE_VERSION" > bin/release-notes.md
          {
            printf '\n### 安装与校验\n\n'
            printf '%s\n' \
              '- Linux、macOS、FreeBSD 下载 `.tar.gz`，Windows 下载 `.zip`；先按 `SHA256SUMS` 校验，再解压。' \
              '- 压缩包只包含程序；升级时保留已有配置和数据。' \
              '- 从 `v0.2.0` 首次升级需停止服务后手动替换程序，再启动服务；之后可使用 `update`。'
            printf '%s\n' "- 首次安装需要配置示例时，查看 [sui-copilot.toml.sample]($REPOSITORY_URL/blob/$RELEASE_VERSION/sui-copilot.toml.sample)。"
            printf '\n[完整变更](%s)\n' "$changes_url"
          } >> bin/release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            bin/release/*.tar.gz
            bin/release/*.zip
            bin/release/SHA256SUMS
          body_path: bin/release-notes.md
          fail_on_unmatched_files: true
