version: '3'

interval: 2s

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  setup:
    desc: Verify build tools and install dependencies
    deps: [web:install]
    cmds:
      - go mod download

  fmt:
    desc: Format Go sources
    cmds:
      - gofmt -w cmd internal

  check:
    desc: Run static checks
    deps: [fmt]
    cmds:
      - go vet ./...

  test:
    desc: Run Go tests
    deps: [check]
    cmds:
      - go test ./... -count=1

  web:install:
    desc: Install frontend dependencies
    sources:
      - web/package.json
      - web/package-lock.json
    generates:
      - web/node_modules/.package-lock.json
    cmds:
      - |
        set -eu
        command -v node >/dev/null 2>&1 || { echo "node is required; install Node.js before building the frontend" >&2; exit 1; }
        command -v npm >/dev/null 2>&1 || { echo "npm is required; install Node.js before building the frontend" >&2; exit 1; }
        npm --prefix web ci

  web:build:
    desc: Build Vue frontend
    status:
      - test -s web/dist/index.html
      - test -f .task/web-ui-build.hash
      - |
        current=$(find ./web \
          -path './web/node_modules' -prune -o \
          -path './web/dist' -prune -o \
          -type f -print | sort | xargs cat | \
          (sha256sum 2>/dev/null || shasum -a 256) | cut -c1-64)
        test -n "$current" && test "$(cat .task/web-ui-build.hash)" = "$current"
    cmds:
      - task: web:install
      - |
        set -eu
        npm --prefix web run build
        test -s web/dist/index.html || { echo "frontend build did not produce web/dist/index.html" >&2; exit 1; }
        test -d web/dist/assets || { echo "frontend build did not produce web/dist/assets" >&2; exit 1; }
      - |
        set -eu
        current=$(find ./web \
          -path './web/node_modules' -prune -o \
          -path './web/dist' -prune -o \
          -type f -print | sort | xargs cat | \
          (sha256sum 2>/dev/null || shasum -a 256) | cut -c1-64)
        mkdir -p .task
        echo "$current" > .task/web-ui-build.hash

  web:embed:
    desc: Copy the verified frontend build into Go's embedded filesystem
    deps: [web:build]
    status:
      - test -s internal/httpapi/static/dist/index.html
      - test -d internal/httpapi/static/dist/assets
      - diff -qr --exclude=.gitkeep web/dist internal/httpapi/static/dist
    cmds:
      - mkdir -p internal/httpapi/static/dist
      - rm -rf internal/httpapi/static/dist/*
      - cp -R web/dist/. internal/httpapi/static/dist/
      - test -s internal/httpapi/static/dist/index.html
      - test -d internal/httpapi/static/dist/assets
      - |
        set -eu
        go list -json ./internal/httpapi | grep -q '"static/dist/assets/' || {
          echo "Go embed metadata does not contain frontend assets" >&2
          exit 1
        }

  build:
    desc: Build frontend then Go binary
    deps: [web:embed]
    cmds:
      - mkdir -p bin
      - |
        set -eu
        GOOS="$(go env GOOS)"
        GOARCH="$(go env GOARCH)"
        OUTPUT="bin/sui-bridge-${GOOS}-${GOARCH}"
        go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" -o "$OUTPUT" ./cmd/sui-bridge
        echo "built $OUTPUT ({{.VERSION}})"

  build:linux:
    desc: Build Linux binaries
    deps: [web:embed]
    cmds:
      - mkdir -p bin
      - |
        set -eu
        GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" -o bin/sui-bridge-linux-amd64 ./cmd/sui-bridge
        GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" -o bin/sui-bridge-linux-arm64 ./cmd/sui-bridge
        echo "built bin/sui-bridge-linux-amd64 ({{.VERSION}})"
        echo "built bin/sui-bridge-linux-arm64 ({{.VERSION}})"

  build:release:
    desc: Build release binaries for Linux and macOS
    deps: [web:embed]
    cmds:
      - mkdir -p bin
      - |
        set -eu
        for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
          GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" \
            -o "bin/sui-bridge-${target%/*}-${target#*/}" ./cmd/sui-bridge
          echo "built bin/sui-bridge-${target%/*}-${target#*/} ({{.VERSION}})"
        done

  dev:
    desc: Build and run the Go server from bin
    method: none
    sources:
      - Taskfile.yml
      - go.mod
      - go.sum
      - cmd/**/*.go
      - internal/**/*.go
      - internal/**/*.sql
      - web/index.html
      - web/package.json
      - web/package-lock.json
      - web/vite.config.ts
      - web/tsconfig.json
      - web/src/**/*
    cmds:
      - task: web:embed
      - task: dev:build
      - cmd: |
          echo "[dev] starting sui-bridge from bin"
          exec bash ./scripts/dev/run-sui-bridge.sh ./bin/sui-bridge-$(go env GOOS)-$(go env GOARCH)
        silent: true

  dev:build:
    internal: true
    desc: Rebuild the development binary after Go or frontend source changes
    sources:
      - go.mod
      - go.sum
      - cmd/**/*.go
      - internal/**/*.go
      - internal/**/*.sql
      - web/index.html
      - web/package.json
      - web/package-lock.json
      - web/vite.config.ts
      - web/tsconfig.json
      - web/src/**/*
    generates:
      - bin/sui-bridge-{{OS}}-{{ARCH}}
    cmds:
      - mkdir -p bin
      - go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" -o bin/sui-bridge-{{OS}}-{{ARCH}} ./cmd/sui-bridge

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin web/dist
